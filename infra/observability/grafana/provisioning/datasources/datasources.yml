apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: 'prometheus'
        tags: [{ key: 'service.name', value: 'service' }, { key: 'http.status_code', value: 'status' }]
        queries:
          - name: 'Throughput (RPS)'
            query: 'sum(rate(cifra_http_requests_total{$$__tags}[1m]))'
          - name: 'Latency (p95)'
            query: 'histogram_quantile(0.95, sum(rate(cifra_http_request_duration_seconds_bucket{$$__tags}[1m])) by (le))'
      serviceMap:
        datasourceUid: 'prometheus'
