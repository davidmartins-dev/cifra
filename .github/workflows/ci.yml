name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validation:
    name: Lint, Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Unit & Integration Tests
        run: pnpm test

  e2e-api:
    name: E2E Tests - Back-end (API com Testcontainers)
    runs-on: ubuntu-latest
    needs: [validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Back-end E2E & Concurrency Tests (Testcontainers)
        env:
          NODE_ENV: test
          JWT_SECRET: super-secret-e2e-jwt-key-with-minimum-32-characters
          JWT_EXPIRES_IN: 15m
        run: pnpm --filter ./apps/api run test:e2e

  load-tests:
    name: Load Tests (Grafana k6)
    runs-on: ubuntu-latest
    needs: [validation, e2e-api]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API in Background for Load Testing
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://cifra_user:cifra_dev_password@localhost:5432/cifra_db?schema=public
          JWT_SECRET: super-secret-e2e-jwt-key-with-minimum-32-characters
          JWT_EXPIRES_IN: 15m
        run: |
          pnpm --filter ./apps/api run build
          (cd apps/api && node dist/main.js) &
          sleep 5

      - name: Run Grafana k6 Load Test
        run: |
          docker run --rm --net=host -v ${{ github.workspace }}/tests/load:/tests grafana/k6 run /tests/k6-load-test.js

  e2e-web:
    name: E2E Tests - Front-end (Playwright)
    runs-on: ubuntu-latest
    needs: [validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers & OS Dependencies
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium firefox webkit

      - name: Build Web Application
        run: pnpm --filter ./apps/web run build

      - name: Run Front-end E2E Tests
        run: pnpm --filter ./apps/web run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  security-scan:
    name: Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [validation, e2e-api]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API in Background for Security Scan
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://cifra_user:cifra_dev_password@localhost:5432/cifra_db?schema=public
          JWT_SECRET: super-secret-e2e-jwt-key-with-minimum-32-characters
          JWT_EXPIRES_IN: 15m
        run: |
          pnpm --filter ./apps/api run build
          (cd apps/api && node dist/main.js) &
          sleep 5

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm --net=host -v ${{ github.workspace }}:/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py -t http://localhost:3000/api/v1/health -r zap-report.html -I

  mutation-tests:
    name: Mutation Tests - Financial Calculations (Stryker)
    runs-on: ubuntu-latest
    needs: [validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker Mutation Testing
        run: pnpm --filter ./apps/api run test:mutation

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/api/reports/mutation/
          retention-days: 14
        