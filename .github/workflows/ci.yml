name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validation:
    name: Lint, Build and Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: cifra_ci
      POSTGRES_PASSWORD: cifra_ci
      POSTGRES_DB: cifra_ci
      DATABASE_URL: postgresql://cifra_ci:cifra_ci@localhost:5432/cifra_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cifra_ci
          POSTGRES_PASSWORD: cifra_ci
          POSTGRES_DB: cifra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cifra_ci -d cifra_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma generate

      - name: Initialize Database
        run: pnpm --filter api prisma db push

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        